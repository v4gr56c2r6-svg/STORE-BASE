
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101a33">
  <title>STORE BASE</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #f3f5fa;
      color: #17233d;
    }

    header {
      background: #101a33;
      color: white;
      padding: 22px;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 4px 18px #0000000a;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    h2 {
      margin-top: 0;
    }

    .status {
      color: #16845b;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>STORE BASE</h1>
    <p>店舗業務管理システム</p>
  </header>

  <main>
    <section class="panel">
      <h2>ようこそ STORE BASEへ</h2>
      <p>店舗業務をもっと簡単に。</p>
      <p class="status">システム準備中</p>
    </section>
  </main>

</body>
</html>
