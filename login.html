<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10233F">
  <meta name="description" content="STORE BASEの会員登録・ログイン画面です。">
  <title>ログイン・会員登録 | STORE BASE</title>
  <link rel="icon" href="./assets/brand-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <style>
    .auth-page { min-height: calc(100vh - 78px); display: grid; place-items: center; padding: 56px 20px; background: linear-gradient(135deg, #f4f7fc, #fff 58%, #edf3fc); }
    .auth-layout { width: min(920px, 100%); display: grid; grid-template-columns: 1fr .9fr; overflow: hidden; border: 1px solid #e3eaf3; border-radius: 24px; background: #fff; box-shadow: 0 24px 72px rgba(16,35,63,.1); }
    .auth-aside { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; min-height: 510px; padding: 42px; color: #fff; background: var(--navy); }
    .auth-aside::before, .auth-aside::after { content: ""; position: absolute; border: 1px solid rgba(255,255,255,.12); border-radius: 50%; pointer-events: none; }
    .auth-aside::before { width: 390px; height: 390px; right: -155px; bottom: -84px; }
    .auth-aside::after { width: 275px; height: 275px; right: -96px; bottom: -28px; }
    .auth-aside .brand-name { color: #fff; }
    .auth-aside-copy { position: relative; z-index: 1; }
    .auth-aside-copy .eyebrow { color: #9ec5ff; }
    .auth-aside h1 { margin: 0; font-size: 37px; line-height: 1.4; letter-spacing: -.045em; }
    .auth-aside p { color: #bdc9d9; font-size: 12px; line-height: 1.9; }
    .auth-aside-mark { position: absolute; right: 33px; bottom: 28px; z-index: 1; opacity: .9; }
    .auth-aside-mark img { width: 83px; height: 83px; box-shadow: 0 10px 24px rgba(0,0,0,.22); border-radius: 22px; }
    .auth-main { padding: 48px 45px 35px; }
    .auth-main h2 { margin: 0; color: var(--navy); font-size: 24px; letter-spacing: -.03em; }
    .auth-intro { margin: 8px 0 27px; color: var(--muted); font-size: 12px; line-height: 1.8; }
    .auth-form label { display: block; margin: 16px 0 7px; color: #35445a; font-size: 11px; font-weight: 750; }
    .auth-form input { width: 100%; min-height: 48px; padding: 0 13px; border: 1px solid #dce4ee; border-radius: 9px; color: var(--ink); background: #fff; outline: none; font-size: 13px; transition: border .15s ease, box-shadow .15s ease; }
    .auth-form input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
    .auth-form input::placeholder { color: #a8b2c0; }
    .auth-submit { width: 100%; margin-top: 25px; cursor: pointer; }
    .auth-submit:disabled { opacity: .65; cursor: progress; transform: none; }
    .auth-switch { margin: 21px 0 0; text-align: center; color: #778497; font-size: 11px; }
    .auth-switch button { padding: 4px 7px; border: 0; color: var(--blue-dark); background: none; font-weight: 750; cursor: pointer; }
    .auth-message { min-height: 22px; margin: 14px 0 0; color: #b64343; text-align: center; font-size: 11px; }
    .auth-message[data-kind="success"] { color: #178054; }
    .auth-note { margin: 22px 0 0; padding: 11px 12px; border-radius: 8px; color: #64748a; background: #f4f7fb; font-size: 10px; line-height: 1.7; }
    .auth-home { display: block; margin-top: 22px; color: #536783; text-align: center; font-size: 10px; }
    .auth-home:hover { color: var(--blue-dark); }
    @media (max-width: 760px) {
      .auth-page { min-height: calc(100vh - 68px); padding: 26px 18px 42px; }
      .auth-layout { max-width: 460px; grid-template-columns: 1fr; border-radius: 19px; }
      .auth-aside { display: none; }
      .auth-main { padding: 34px 25px 28px; }
      .auth-main h2 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="STORE BASE ホーム"><img src="./assets/brand-mark.svg" alt="" width="42" height="42"><span class="brand-name">STORE<span>BASE</span></span></a>
      <a class="text-link" href="./">公式サイトへ <span aria-hidden="true">→</span></a>
    </div>
  </header>
  <main class="auth-page">
    <div class="auth-layout">
      <aside class="auth-aside" aria-label="STORE BASE">
        <a class="brand" href="./"><img src="./assets/brand-mark.svg" alt="" width="42" height="42"><span class="brand-name">STORE<span>BASE</span></span></a>
        <div class="auth-aside-copy"><p class="eyebrow">YOUR STORE, ONE BASE.</p><h1>お店の管理を、<br>ひとつに。</h1><p>小さなお店の毎日を、もっとシンプルに。</p></div>
        <div class="auth-aside-mark"><img src="./assets/brand-mark.svg" alt=""></div>
      </aside>
      <section class="auth-main" aria-labelledby="auth-title">
        <h2 id="auth-title">ログイン</h2>
        <p class="auth-intro">登録済みのメールアドレスでログインできます。</p>
        <form id="loginForm" class="auth-form" novalidate>
          <label for="loginEmail">メールアドレス</label>
          <input id="loginEmail" name="email" type="email" placeholder="example@email.com" autocomplete="email" required>
          <label for="loginPassword">パスワード</label>
          <input id="loginPassword" name="password" type="password" placeholder="パスワード" autocomplete="current-password" required>
          <button class="button auth-submit" id="loginButton" type="submit">ログイン</button>
          <p class="auth-switch">初めての方はこちら <button id="showRegister" type="button">新規登録</button></p>
        </form>
        <form id="register" class="auth-form" hidden>
          <label for="registerEmail">メールアドレス</label>
          <input id="registerEmail" name="email" type="email" placeholder="example@email.com" autocomplete="email" required>
          <label for="registerPassword">パスワード（6文字以上）</label>
          <input id="registerPassword" name="password" type="password" placeholder="6文字以上のパスワード" autocomplete="new-password" minlength="6" required>
          <button class="button auth-submit" id="registerButton" type="submit">アカウントを作成</button>
          <p class="auth-switch">アカウントをお持ちの方 <button id="showLogin" type="button">ログイン</button></p>
        </form>
        <p id="message" class="auth-message" role="status" aria-live="polite"></p>
        <p class="auth-note">現在確認できる機能は会員登録とログインです。店舗管理機能の提供開始時期は未定です。</p>
        <a class="auth-home" href="./">← STORE BASE 公式サイトに戻る</a>
      </section>
    </div>
  </main>
  <script type="module">
    import { loginUser, registerUser } from "./js/auth.js";

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("register");
    const message = document.getElementById("message");
    const title = document.getElementById("auth-title");

    function showForm(mode) {
      const registering = mode === "register";
      loginForm.hidden = registering;
      registerForm.hidden = !registering;
      title.textContent = registering ? "新規会員登録" : "ログイン";
      document.querySelector(".auth-intro").textContent = registering
        ? "メールアドレスとパスワードでアカウントを作成できます。"
        : "登録済みのメールアドレスでログインできます。";
      message.textContent = "";
      message.dataset.kind = "";
      if (window.location.hash !== `#${mode}`) history.replaceState(null, "", `#${mode}`);
    }

    document.getElementById("showRegister").addEventListener("click", () => showForm("register"));
    document.getElementById("showLogin").addEventListener("click", () => showForm("login"));

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!loginForm.reportValidity()) return;
      const button = document.getElementById("loginButton");
      button.disabled = true;
      message.dataset.kind = "";
      message.textContent = "ログイン中...";
      const result = await loginUser(document.getElementById("loginEmail").value.trim(), document.getElementById("loginPassword").value);
      message.textContent = result.success ? "ログインに成功しました！" : result.message;
      if (result.success) {
        message.dataset.kind = "success";
        window.location.assign("./app.html");
      }
      button.disabled = false;
    });

    registerForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!registerForm.reportValidity()) return;
      const button = document.getElementById("registerButton");
      button.disabled = true;
      message.dataset.kind = "";
      message.textContent = "登録中...";
      const result = await registerUser(document.getElementById("registerEmail").value.trim(), document.getElementById("registerPassword").value);
      message.textContent = result.success ? "会員登録に成功しました！" : result.message;
      if (result.success) {
        message.dataset.kind = "success";
        window.location.assign("./app.html");
      }
      button.disabled = false;
    });

    showForm(window.location.hash === "#register" ? "register" : "login");
  </script>
</body>
</html>
